name: "Build and push images"
on:
  schedule:
    - cron: "5 4 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-push:
    if: github.server_url == 'https://github.com' && github.repository == 'sebatec-eu/forgejo-runner-images'
    strategy:
      fail-fast: false
      matrix:
        runners:
          - release: stable
            tags:
              - "latest"
              - "1"
              - "1.2"
              - "1.2.0"
          - release: testing
            tags:
              - "latest"
              - "1"
              - "1.2"
              - "1.2.0"
    concurrency:
      group: ${{ github.workflow }}-${{ toJSON(matrix.runners) }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    container:
      image: "docker.io/debian:testing@sha256:1c79280f13304aedb1d88795f80fbc26d818f951e56adab23d365ea626187271"
      options: --privileged
    permissions:
      packages: write
    steps:
      - name: Install relevant tools
        run: apt-get update && apt-get install -y podman mkosi make
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Checkout (GitHub)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Build container
        run: make build-${{ matrix.runners.release }}
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin --authfile=/tmp/auth.json
      - name: Push container
        run: make push-${{ matrix.runners.release }}
        env:
          TAGS: ${{ join(matrix.runners.tags, ' ') }}
          REGISTRY_AUTH_FILE: /tmp/auth.json
