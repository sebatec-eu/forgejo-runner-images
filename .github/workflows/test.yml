name: "Test builds"
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test-build:
    strategy:
      matrix:
        runners:
          - release: stable
          - release: testing
    runs-on: ubuntu-latest
    container:
      image: "docker.io/debian:testing@sha256:2d46f43b677a047cfab870549eea0d83d0a9bea2f55b3f481efc901043916c2a"
      options: --privileged
    steps:
      - name: Install relevant tools
        run: apt-get update && apt-get install -y podman mkosi make
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build container
        run: make build-${{ matrix.runners.release }}
