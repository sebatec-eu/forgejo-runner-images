name: "Test builds"
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test-build:
    strategy:
      matrix:
        runners:
          - release: stable
          - release: testing
    runs-on: ubuntu-latest
    container:
      image: "docker.io/debian:testing@sha256:b674db8153a7240c49365495ea7adca1eaab6d7a64e5bc87bfc58499186150f0"
      options: --privileged
    steps:
      - name: Install relevant tools
        run: apt-get update && apt-get install -y podman mkosi make
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build container
        run: make build-${{ matrix.runners.release }}
